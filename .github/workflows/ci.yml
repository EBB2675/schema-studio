name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static app and snapshot core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked --python 3.11
      - run: npm --prefix web ci
      - run: npm --prefix web run lint
      - run: npm --prefix web run test:run
      - run: uv run pytest api/sources/tests extractor/tests
      - run: npm --prefix web run build:pages
      - name: Build fixture snapshots for browser smoke tests
        run: uv run python web/e2e/build_fixtures.py --out web/dist/data
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Smoke-test the Pages artifact
        run: npm --prefix web run test:smoke
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-ci
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore
