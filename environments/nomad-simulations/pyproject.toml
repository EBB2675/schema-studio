# Profile environment for nomad-simulations. It only holds the schema package, from the
# tip of its tracked branch; the app never imports from it and only runs
# scripts from extractor/scripts/ with this environment's interpreter.
[project]
name = "schema-studio-env-nomad-simulations"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nomad-simulations @ git+https://github.com/nomad-coe/nomad-simulations.git@develop",
]

[tool.uv]
package = false
