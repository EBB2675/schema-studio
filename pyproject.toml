[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-studio"
version = "0.1.0"
description = "Static schema studio snapshot builder"
authors = [{name = "Schema Studio Team"}]
requires-python = ">=3.11"
dependencies = [
  "platformdirs",
  "jsonschema>=4.0",
  "linkml-runtime==1.11.1",
  "pyyaml>=6",
]

[tool.setuptools.packages.find]
include = ["api", "api.*", "extractor", "extractor.*"]

[tool.setuptools.package-data]
"extractor" = ["contract.schema.json"]

[dependency-groups]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
markers = ["slow: needs the real schema environments under environments/ (run with `pytest -m slow`)"]
addopts = "-m 'not slow'"
